site_name: reachq
site_description: Graph reachability, queryable.
site_url: https://github.com/sachncs/parallel-reachability-and-shortest-paths
repo_url: https://github.com/sachncs/parallel-reachability-and-shortest-paths
docs_dir: docs

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [reachq]
          options:
            show_root_heading: true
            show_symbol_class_heading: true
            show_symbol_class_toc: true
            show_source: false

nav:
  - Overview: START_HERE.md
  - Why reachq: WHY.md
  - Getting started: getting-started.md
  - API reference: REFERENCE.md
  - Algorithms: algorithms.md
  - Paper: PAPER.md
  - Benchmarks: benchmarks.md
  - Architecture: architecture.md
  - Correctness: notes_correctness.md
  - Spectral fixtures: spectral_fixtures.md
  - Fix/Resample: fix_resample.md
  - Streaming: reachq/research/streaming.py
  - Approximation: reachq/research/approximation.py
  - Glossary: GLOSSARY.md
  - Inspired by: INSPIRED_BY.md
  - FAQ: faq.md
  - Deployment: deployment.md
  - Work-depth: work-depth.md
  - Lit survey: lit_survey.md
  - Changelog: ../CHANGELOG.md
  - Contributing: ../CONTRIBUTING.md
