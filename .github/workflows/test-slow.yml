name: Test (slow)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  test-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full test suite
        run: pytest --timeout=300 -q
