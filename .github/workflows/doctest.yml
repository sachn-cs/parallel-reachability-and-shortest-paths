name: Doctests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run doctests
        run: pytest --doctest-modules reachq
