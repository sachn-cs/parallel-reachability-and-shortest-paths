[tox]
envlist = py310, py311, py312, py313
isolated_build = true

[testenv]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    hypothesis>=6.0.0
commands =
    pytest {posargs:-x -q}

[testenv:lint]
basepython = python3.12
deps =
    ruff>=0.1.0
    mypy>=1.0.0
commands =
    ruff check reachq tests scripts
    mypy reachq

[testenv:format]
basepython = python3.12
deps =
    ruff>=0.1.0
commands =
    ruff format reachq tests scripts
    ruff check --fix reachq tests scripts
