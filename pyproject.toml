[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prspnsd"
version = "0.1.0"
description = "Deterministic parallel reachability and shortest paths on non-sparse digraphs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Reproduction Team", email = "repro@example.com"}
]
keywords = [
    "graph-algorithms",
    "reachability",
    "shortest-paths",
    "shortcut-sets",
    "hopsets",
    "parallel-algorithms",
    "digraphs",
    "transitive-closure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/sachn-cs/parallel-reachability-and-shortest-paths"
Documentation = "https://github.com/sachn-cs/parallel-reachability-and-shortest-paths/tree/master/docs"
Repository = "https://github.com/sachn-cs/parallel-reachability-and-shortest-paths.git"
Issues = "https://github.com/sachn-cs/parallel-reachability-and-shortest-paths/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["prspnsd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests that use pytest-benchmark",
]

[tool.coverage.run]
source = ["prspnsd"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102"]
"scripts/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"
