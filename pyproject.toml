[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachq"
version = "0.8.0"
description = "Parallel reachability and shortest-path algorithms on digraphs. Insertion-order vertex indexing, deterministic cross-process reproducibility, and Boolean-semiring transitive closure."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sachin <sachncs@gmail.com>"}
]
keywords = [
    "graph-algorithms",
    "reachability",
    "shortest-paths",
    "shortcut-sets",
    "hopsets",
    "parallel-algorithms",
    "digraphs",
    "transitive-closure",
    "numpy",
    "computational-geometry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.10.0",
]

[project.scripts]
reachq = "reachq.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
    "mypy>=1.0.0",
    "networkx>=3.0",
    "ruff==0.16.3",
]
research = [
    "networkx>=3.0",
]
accel = [
    "cython>=3.0.0",
    "numba>=0.57.0",
    "maturin>=1.0.0",
]
accel-cython = [
    "cython>=3.0.0",
]
accel-numba = [
    "numba>=0.57.0",
]
accel-rust = [
    "maturin>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/sachncs/parallel-reachability-and-shortest-paths"
Documentation = "https://github.com/sachncs/parallel-reachability-and-shortest-paths/tree/main/docs"
Repository = "https://github.com/sachncs/parallel-reachability-and-shortest-paths.git"
Issues = "https://github.com/sachncs/parallel-reachability-and-shortest-paths/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["reachq*"]

[tool.cibuildwheel]
# The user-side [6.x] commit uploads built wheels via GitHub Release
# artifacts. This block configures what cibuildwheel will build.
# Per-platform `[tool.cibuildwheel.<platform>]` sections override the
# top-level keys; `build-platform` is a CLI option only and is rejected
# if placed in a config file.
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]
[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --doctest-modules"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests that use pytest-benchmark",
]

[tool.coverage.run]
source = ["reachq"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["N806", "UP007"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = "build/|site/|dist/"
ignore_errors = true
namespace_packages = true

[[tool.mypy.overrides]]
# Tests, scripts, benchmarks, and examples are dev tooling, not the
# shipped library API: untyped helper bodies are lenient, but any
# annotated function in these trees is still strictly checked (see
# scripts/cli.py, which is fully annotated and must stay clean).
module = ["tests.*", "scripts.*", "benchmarks.*", "examples.*"]
disallow_untyped_defs = false
check_untyped_defs = false
